name: PWS Cup 2026 Monitor
run-name: PWS Cup 2026 Monitor · ${{ inputs.trigger_source || github.event_name }}

on:
  schedule:
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: '起動元（外部定期実行と手動実行を区別）'
        type: choice
        options:
          - manual
          - cron-job.org
        default: manual
      dry_run:
        description: '取得・検証のみ（状態保存とDiscord通知を行わない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pws-cup-2026-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check configuration
        id: config
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          elif [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "mode=unconfigured" >> "$GITHUB_OUTPUT"
            echo '::warning::DISCORD_WEBHOOK_URL is missing; monitoring is not active.'
            echo '## 設定待ち：Discord Secret未登録。監視・通知は開始していません。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=monitor" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify public leaderboard access
        if: steps.config.outputs.mode != 'monitor'
        run: python main.py --dry-run
      - name: Verify Discord Webhook without sending a message
        if: steps.config.outputs.mode == 'monitor'
        run: |
          python - <<'PY'
          import os
          import re
          from main import request_json
          url = os.environ['DISCORD_WEBHOOK_URL'].strip()
          if not re.fullmatch(r'https://(?:discord\.com|discordapp\.com)/api(?:/v\d+)?/webhooks/\d+/[A-Za-z0-9._-]+', url):
              raise SystemExit('Invalid Discord Webhook URL format')
          metadata = request_json(url)
          if metadata.get('channel_id') != '1548272951093235814':
              raise SystemExit('Discord Webhook is not for the configured notification channel')
          print('Discord Webhook verified for #codabench-update. No message sent.')
          PY
      - name: Restore durable state
        if: steps.config.outputs.mode == 'monitor'
        run: |
          if git ls-remote --exit-code --heads origin monitor-state; then
            git fetch --no-tags --depth=1 origin monitor-state
            git worktree add --detach .state-store FETCH_HEAD
          else
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
            git worktree add --detach .state-store HEAD
          fi
      - name: Monitor current leaderboard
        id: check
        if: steps.config.outputs.mode == 'monitor'
        run: python main.py --state .state-store/.monitor/state.json
      - name: Persist baseline and delivery progress
        if: always() && steps.check.outcome != 'skipped' && steps.config.outputs.mode == 'monitor'
        run: |
          if [ ! -f .state-store/.monitor/state.json ]; then exit 0; fi
          git -C .state-store config user.name 'github-actions[bot]'
          git -C .state-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .state-store add -f .monitor/state.json
          if ! git -C .state-store diff --cached --quiet; then
            git -C .state-store commit -m 'Save leaderboard state and notification progress'
            git -C .state-store push origin HEAD:refs/heads/monitor-state
          fi
