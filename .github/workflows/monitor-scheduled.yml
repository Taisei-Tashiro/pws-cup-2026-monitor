name: PWS Cup 2026 Monitor
run-name: PWS Cup 2026 Monitor · ${{ inputs.trigger_source || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: '起動元（外部定期実行と手動実行を区別）'
        type: choice
        options:
          - manual
          - cron-job.org
        default: manual
      dry_run:
        description: '取得・検証のみ（状態保存とDiscord通知を行わない）'
        type: boolean
        default: false
      recovery_probe:
        description: '自動復旧の待機試験（dry_run=true時のみ。通常監視とは別枠）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test recovery safety rules
        run: python3 -m unittest discover -s tests -p 'test_watchdog.py' -v
      - name: Release stale unassigned monitor jobs
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 watchdog.py

      - name: Read-only API consistency diagnostic
        if: ${{ inputs.dry_run && !inputs.recovery_probe }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, time
          from watchdog import GitHub
          api = GitHub(os.environ['GH_TOKEN'])
          mismatches = 0
          for sample in range(20):
              for status in ('in_progress', 'pending', 'queued'):
                  data = api.request('/actions/runs?branch=main&event=workflow_dispatch&status=' + status + '&per_page=100')
                  count, rows = data['total_count'], len(data['workflow_runs'])
                  if count != rows:
                      mismatches += 1
                      print(f'Sample {sample}, {status}: total_count={count}, returned={rows}', flush=True)
              time.sleep(1)
          print(f'Read-only diagnostic completed: {mismatches} inconsistent count(s).')
          PY

  monitor:
    # Allow cancellation while queued; step conditions protect delivery and
    # state persistence if runner assignment races the final watchdog check.
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    concurrency:
      group: ${{ inputs.dry_run && inputs.recovery_probe && 'pws-cup-monitor-recovery-probe' || 'pws-cup-2026-monitor' }}
      cancel-in-progress: false
    runs-on: ${{ inputs.dry_run && inputs.recovery_probe && 'pws-cup-unassigned-recovery-probe' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ !failure() }}
      - uses: actions/setup-python@v6
        if: ${{ !failure() }}
        with:
          python-version: '3.12'
      - name: Run regression tests
        if: ${{ !failure() }}
        run: python -m unittest discover -s tests -v
      - name: Check configuration
        if: ${{ !failure() }}
        id: config
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          elif [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "mode=unconfigured" >> "$GITHUB_OUTPUT"
            echo '::warning::DISCORD_WEBHOOK_URL is missing; monitoring is not active.'
            echo '## 設定待ち：Discord Secret未登録。監視・通知は開始していません。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=monitor" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify public leaderboard access
        if: ${{ !failure() && steps.config.outputs.mode != 'monitor' }}
        run: python main.py --dry-run
      - name: Verify Discord Webhook without sending a message
        if: ${{ !failure() && steps.config.outputs.mode == 'monitor' }}
        run: |
          python - <<'PY'
          import os
          import re
          from main import request_json
          url = os.environ['DISCORD_WEBHOOK_URL'].strip()
          if not re.fullmatch(r'https://(?:discord\.com|discordapp\.com)/api(?:/v\d+)?/webhooks/\d+/[A-Za-z0-9._-]+', url):
              raise SystemExit('Invalid Discord Webhook URL format')
          metadata = request_json(url)
          if metadata.get('channel_id') != '1548272951093235814':
              raise SystemExit('Discord Webhook is not for the configured notification channel')
          print('Discord Webhook verified for #codabench-update. No message sent.')
          PY
      - name: Restore durable state
        if: ${{ !failure() && steps.config.outputs.mode == 'monitor' }}
        run: |
          if git ls-remote --exit-code --heads origin monitor-state; then
            git fetch --no-tags --depth=1 origin monitor-state
            git worktree add --detach .state-store FETCH_HEAD
          else
            code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
            git worktree add --detach .state-store HEAD
          fi
      - name: Monitor current leaderboard
        id: check
        if: ${{ !failure() && steps.config.outputs.mode == 'monitor' }}
        run: python main.py --state .state-store/.monitor/state.json
      - name: Persist baseline and delivery progress
        if: always() && steps.check.outcome != 'skipped' && steps.config.outputs.mode == 'monitor'
        run: |
          if [ ! -f .state-store/.monitor/state.json ]; then exit 0; fi
          git -C .state-store config user.name 'github-actions[bot]'
          git -C .state-store config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .state-store add -f .monitor/state.json
          if ! git -C .state-store diff --cached --quiet; then
            git -C .state-store commit -m 'Save leaderboard state and notification progress'
            git -C .state-store push origin HEAD:refs/heads/monitor-state
          fi
